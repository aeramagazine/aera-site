<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gallery — Aera Magazine</title>
  <meta name="description" content="Photography from every Aera Magazine shoot.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Anton&family=Bodoni+Moda:opsz,wght@6..96,400..700&family=Pinyon+Script&display=swap" rel="stylesheet">
  <link rel="preload" href="assets/fonts/OPTIOnyx.otf" as="font" type="font/otf" crossorigin>
  <link rel="stylesheet" href="assets/css/style.css?v=2026111516001">
</head>
<body data-page="gallery">
  <div id="site-header"></div>
  <main>
    <!-- BANNER: replace assets/img/gallery/hero.jpg with your photo (same file name, about 2700 x 1000). -->
    <section class="about-hero">
      <img src="assets/img/gallery/hero.jpg" alt="" width="2700" height="1000">
      <h1 class="about-hero-title">Gallery</h1>
    </section>

    <!-- THE RING: rises into view as you scroll -->
    <section id="ring-view" aria-label="Gallery: a ring of photographs">
      <p class="sr-only">Drag to turn the ring. Press Enter on a photo to open it, or on a coloured card to see just that shoot.</p>
      <div class="ring-pin">
        <div class="ring-rise" id="ring-rise"><div class="stage" id="stage" role="group" aria-label="Photographs from every shoot"></div></div>
      </div>
    </section>

    <section id="grid-view" class="wrap" hidden>
      <header class="page-head"><span class="kicker mono">photography from every shoot</span><h2 class="page-title">The <em>Gallery</em></h2></header>
      <div class="filters" id="shoot-filters" role="group" aria-label="Filter by shoot"></div>
      <div class="masonry" id="masonry"></div>
    </section>
  </main>

  <div class="lightbox" id="lightbox" hidden role="dialog" aria-modal="true" aria-label="Photo viewer">
    <div class="top mono"><span class="lb-count"></span><button class="lb-close">close ✕</button></div>
    <div class="stagebox"><img alt=""></div>
    <div class="bottom mono"><button class="lb-prev">← prev</button><span class="lb-credits"></span><button class="lb-next">next →</button></div>
  </div>
  <div id="site-footer"></div>
  <script src="assets/js/data.js?v=2026111516001"></script>
  <script src="assets/js/main.js?v=2026111516001"></script>
  <script src="assets/js/ring.js?v=2026111516001"></script>
</body>
</html>
